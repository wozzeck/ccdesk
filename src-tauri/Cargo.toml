[package]
name = "ccdesk"
version = "0.1.0"
description = "Cliente de escritorio para sesiones de Claude Code (backend tmux)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
signal-hook = "0.3"
# La misma que usa Tauri: ventana al frente con la hora del lanzador y selector de carpetas.
gtk = "0.18"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
